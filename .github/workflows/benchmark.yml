name: benchmark

# Benchmarks are never run on push: a shared CI runner is noisy, and a number produced on one is worse
# than no number at all. This is a deliberate, on-demand run whose output is an artifact to read, not a
# gate to pass.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'JMH benchmark filter, e.g. ScalarsBenchmark or "encode_"'
        required: false
        default: ''
      forks:
        description: 'Forks per benchmark'
        required: false
        default: '2'
      iterations:
        description: 'Measurement iterations per fork'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  benchmark:
    name: JMH
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the JMH jar
        run: mvn -B -ntp -q -Pbenchmark package -DskipTests

      - name: Run
        run: |
          java -jar protogen-benchmark/target/benchmarks.jar \
            ${{ inputs.pattern }} \
            -f ${{ inputs.forks }} \
            -wi 5 -i ${{ inputs.iterations }} -r 1s -w 1s \
            -rf json -rff jmh-result.json \
            | tee jmh-result.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo '## JMH results'
            echo
            echo 'Runner hardware is shared and noisy - read the ratios, not the absolutes.'
            echo
            echo '```'
            sed -n '/^Benchmark /,$p' jmh-result.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: |
            jmh-result.json
            jmh-result.txt
          retention-days: 30
