syntax = "proto3";

package io.github.helios57.protogen.it;

option java_multiple_files = true;
option java_package = "io.github.helios57.protogen.it.model";

/**
 * Stage of a deployment.
 */
enum StageEnumV1 {
  DEV = 0;
  TEST = 1;
  INT = 2;
  PROD = 3;
}

/**
 * Exercises the shapes the surveyed protos actually use: nested messages, enums, repeated,
 * map and explicit presence in one file.
 */
message NodeV1 {
  // @Example node-a
  string name = 1;

  StageEnumV1 stage = 2;

  // Optional suffix; must be distinguishable from the empty string.
  optional string stageSuffix = 3;

  // Unpacked on the wire for message types, packed for scalars.
  repeated NodeV1 children = 4;
  repeated int32 ports = 5;
  repeated string tags = 6;

  // @Example { primary: https://a.example, backup: https://b.example }
  map<string, string> endpoints = 7;

  message CoordinatesV1 {
    double latitude = 1;
    double longitude = 2;
  }

  CoordinatesV1 location = 8;

  enum KindV1 {
    UNKNOWN = 0;
    BROKER = 1;
    CONCENTRATOR = 2;
  }

  KindV1 kind = 9;
}

message NodesV1 {
  repeated NodeV1 nodes = 1;
}
