syntax = "proto3";

package protogen.it;

option java_multiple_files = true;
option java_package = "protogen.it.model";

import "google/protobuf/timestamp.proto";

/**
 * Timestamp fields surface as java.time.Instant, and travel exactly as protoc writes them: a
 * submessage of {int64 seconds = 1; int32 nanos = 2;}. The import is not needed - protogen knows the
 * well-known types - but it is written here because protoc needs it, and both sides compile this file.
 */
message EventV1 {
  // @Example event-1
  string eventId = 1;

  // When the event happened.
  google.protobuf.Timestamp occurredAt = 2;

  // Optional: unset stays distinguishable from the epoch.
  optional google.protobuf.Timestamp acknowledgedAt = 3;

  repeated google.protobuf.Timestamp retryAt = 4;
}
