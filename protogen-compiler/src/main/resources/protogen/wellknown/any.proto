// A well-known type, bundled with protogen so that a schema naming it needs no import.
// Field numbers and types are those of google/protobuf/any.proto; the wire encoding is identical.
syntax = "proto3";

package google.protobuf;

option java_package = "$PACKAGE$";
option java_multiple_files = true;

// An arbitrary serialized message, with a URL saying what it is.
//
// Unpacking is left to the caller: parse `value` with the generated type named by `typeUrl`.
message Any {
  string type_url = 1;
  bytes value = 2;
}
